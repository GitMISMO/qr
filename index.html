<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>QR Code Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: the MISMO family shell — navy masthead, left rail of sections, cards that open a right-hand panel. */
:root{
 --navy:#0d314c; --sky:#74bfeb; --navy-deep:#06202f; --navy-mid:#14486e;
 --sky-soft:#a9d8f3; --sky-wash:#e4f2fb;
 --ground:#f1f6fa; --surface:#ffffff; --surface-2:#f6fafd; --surface-3:#e9f1f8;
 --border:#d5e2ed; --border-strong:#adc4d6; --rule:#e5eef5; --line:#e5eef5; --sunk:#f6fafd;
 --ink:#0d314c; --ink-2:#456179; --ink-3:#7794aa;
 --good:#0f7b5c; --bad:#b3372c; --warn:#a2701a;
 --accent-soft:#e4f2fb; --link:#14486e;
 --c1:#2477b8;
 --display:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
 --ui:var(--display); --mono:var(--display);
 --hq-h:64px; --rail-w:240px; --rail-mini:62px;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
 --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
 --border:#1f4a63; --border-strong:#2f6688; --rule:#173547; --line:#173547; --sunk:#123143;
 --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
 --good:#4fc79b; --bad:#f08579; --warn:#e0a83c; --accent-soft:#173c52; --link:#74bfeb;
 --sky-wash:#173c52; --c1:#3987e5;
 color-scheme:dark; } }
:root[data-theme="dark"]{
 --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
 --border:#1f4a63; --border-strong:#2f6688; --rule:#173547; --line:#173547; --sunk:#123143;
 --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
 --good:#4fc79b; --bad:#f08579; --warn:#e0a83c; --accent-soft:#173c52; --link:#74bfeb;
 --sky-wash:#173c52; --c1:#3987e5;
 color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.55;
 font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{letter-spacing:-.012em;margin:0;text-wrap:balance}
button{font-family:inherit}
a{color:var(--link)}
[hidden]{display:none!important}

/* ── masthead ───────────────────────────────────────────────── */
.hqtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:97;height:var(--hq-h);
  background:var(--navy);color:#fff;display:flex;align-items:center;gap:0;
  padding:0 22px;box-shadow:0 1px 0 rgba(80,164,219,.28);
  margin-left:calc(0px - var(--rail-w));width:calc(100% + var(--rail-w));
  transition:margin-left .2s cubic-bezier(.4,0,.2,1), width .2s cubic-bezier(.4,0,.2,1)}
body.railmini .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
@media (prefers-reduced-motion:reduce){ .hqtop{transition:none} }
.hqtop .mastrule{display:block;width:2px;height:34px;flex:0 0 auto;margin-inline:20px;border-radius:1px;background:var(--sky)}
.hqtop .hqname{font-family:var(--display);font-size:15.5px;font-weight:700;letter-spacing:-.005em;color:var(--sky);white-space:nowrap}
.hqtop-r{margin-left:auto;display:flex;align-items:center;gap:13px}
.hqtop .eyebrow-m{font-family:var(--display);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600;white-space:nowrap}
@media(max-width:700px){.hqtop .eyebrow-m{display:none}}
.logoplate{background:#fff;border-radius:7px;padding:8px 14px;display:flex;align-items:center;line-height:0;flex:0 0 auto;position:relative}
.logoplate .wordmark{height:24px;width:auto;display:block}
.santa{position:absolute;display:none;pointer-events:none;left:-9px;top:-12px;width:31px;height:31px}
html[data-season="december"] .santa{display:block}
body.bare .santa{display:none!important}
@media(max-width:520px){ .hqtop{padding:0 14px} .hqtop .mastrule{margin-inline:12px} .logoplate{padding:7px 10px} .logoplate .wordmark{height:20px} }

/* ── rail ───────────────────────────────────────────────────── */
.hq.rail{position:fixed;left:0;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));bottom:0;width:var(--rail-w);z-index:95;
  background:var(--navy);color:#fff;display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden auto;overscroll-behavior:contain;
  box-shadow:1px 0 0 rgba(80,164,219,.22), 4px 0 18px rgba(6,32,47,.14);transition:width .2s cubic-bezier(.4,0,.2,1)}
body{padding-left:var(--rail-w);transition:padding-left .2s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){ .hq.rail,body{transition:none} }
body.railmini{padding-left:var(--rail-mini)}
body.railmini .hq.rail{width:var(--rail-mini)}
body.railmini .rail-top{justify-content:center;padding:10px 0 9px}
body.railmini .rail-lbl{display:none}
body.railmini .railhide{margin:0}
body.railmini .railhide svg{transform:scaleX(-1)}
body.railmini .railfind{padding:9px 0 2px;display:flex;justify-content:center}
body.railmini .railfind .fi, body.railmini .railfind input, body.railmini .railq-x, body.railmini .railhits{display:none}
body.railmini .railfind-b{display:flex}
body.railmini .hq nav{padding:6px 0 4px;align-items:center;gap:4px}
body.railmini .hq nav button{width:42px;padding:10px 0;justify-content:center;border-radius:9px;box-shadow:none}
body.railmini .hq nav button span{display:none}
body.railmini .hq nav button svg{width:19px;height:19px}
body.railmini .hq nav button[aria-current]{background:var(--sky);color:var(--navy-deep)}
body.railmini .hq nav button[aria-current] svg{stroke:var(--navy-deep);opacity:1}
body.railmini .hq .mast-right{gap:3px;padding:8px 0 11px;align-items:center}
body.railmini .hq .mast-right .theme-btn{width:42px;padding:9px 0;font-size:0;justify-content:center;border-radius:9px}
body.railmini .hq .mast-right .theme-btn .ti{width:19px;height:19px}
body.railmini .hq .mast-right .theme-btn span{display:none}
body.railmini .hq .mast-right #theme-btn{margin-top:4px;padding-top:10px;border-radius:9px}
body.railmini .railwho{display:none}
.railfind-b{display:none;width:34px;height:30px;border:1px solid rgba(255,255,255,.18);border-radius:7px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);align-items:center;justify-content:center;padding:0}
.railfind-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.railfind-b:hover{background:rgba(255,255,255,.18);color:#fff}
.rail-top{display:flex;align-items:center;gap:8px;padding:11px 10px 9px;border-bottom:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.rail-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.55);padding-left:3px}
.railhide{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:5px;color:rgba(255,255,255,.75);width:24px;height:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.railhide svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.railhide:hover{background:rgba(255,255,255,.14);color:#fff}
.railfind{position:relative;padding:11px 12px 3px;flex:0 0 auto}
.railfind .fi{position:absolute;left:21px;top:20px;width:14px;height:14px;fill:none;stroke:rgba(255,255,255,.5);stroke-width:2;stroke-linecap:round;pointer-events:none}
.railfind input[type=search]{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#fff;font:inherit;font-size:12.5px;padding:6px 26px 6px 30px}
.railfind input[type=search]::placeholder{color:rgba(255,255,255,.5)}
.railfind input[type=search]:focus{outline:2px solid var(--sky);outline-offset:-1px;background:rgba(255,255,255,.16)}
.railfind input::-webkit-search-cancel-button{display:none}
.railq-x{position:absolute;right:17px;top:16px;width:20px;height:20px;border:0;border-radius:4px;background:transparent;color:rgba(255,255,255,.6);font-size:15px;line-height:1;padding:0;cursor:pointer}
.railq-x:hover{background:rgba(255,255,255,.16);color:#fff}
.railhits{margin-top:7px;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;box-shadow:0 10px 26px rgba(6,32,47,.3);overflow:hidden auto;max-height:min(52vh,420px)}
.railhits .rh-g{font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);background:var(--sunk);padding:4px 10px;border-bottom:1px solid var(--line);position:sticky;top:0}
.railhits .rh{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 10px;color:var(--ink);cursor:pointer}
.railhits .rh:last-child{border-bottom:0}
.railhits .rh:hover,.railhits .rh.on{background:var(--accent-soft)}
.railhits .rh b{display:block;font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.railhits .rh i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:1px;overflow-wrap:anywhere}
.railhits .rh-none{padding:10px;font-size:12px;color:var(--ink-3)}
.hq nav{display:flex;flex-direction:column;gap:1px;padding:8px 8px 4px;flex:0 0 auto}
.hq nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.hq nav button svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.hq nav button:hover{color:#fff;background:rgba(255,255,255,.09)}
.hq nav button[aria-current]{color:#fff;font-weight:600;background:var(--navy-mid);box-shadow:inset 3px 0 0 var(--sky)}
.hq nav button[aria-current] svg{opacity:1;stroke:var(--sky)}
.hq nav button:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.hq .mast-right{margin-top:auto;display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:8px 8px 10px;border-top:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.railwho{padding:6px 10px 4px;font-size:11.5px;color:rgba(255,255,255,.62);line-height:1.35;overflow-wrap:anywhere}
.railwho b{display:block;color:#fff;font-weight:600;font-size:12.5px}
.theme-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.theme-btn .ti{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.theme-btn .ti-sun{display:none}
:root[data-theme="dark"] .theme-btn .ti-moon{display:none}
:root[data-theme="dark"] .theme-btn .ti-sun{display:block}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .theme-btn .ti-moon{display:none} :root:not([data-theme="light"]) .theme-btn .ti-sun{display:block} }
.theme-btn:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.09)}
.theme-btn:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.hq .mast-right #theme-btn{margin-top:5px;padding-top:11px;border-top:1px solid rgba(80,164,219,.18);border-radius:0 0 6px 6px}
.railscrim{position:fixed;inset:0;z-index:94;background:rgba(6,32,47,.42);border:0;padding:0;display:none}
@media(max-width:900px){
  body:not(.railmini){padding-left:var(--rail-mini)}
  body:not(.railmini) .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
  body:not(.railmini) .hq.rail{box-shadow:4px 0 26px rgba(6,32,47,.4)}
  body:not(.railmini) .railscrim{display:block}
}
/* screens without the rail (sign-in, the page a scanner sees) */
body.bare, body.bare.railmini{padding-left:0}
body.bare .hqtop, body.bare.railmini .hqtop{margin-left:0;width:100%}

/* ── page ───────────────────────────────────────────────────── */
.wrap{padding-block:26px 90px;padding-inline:30px}
@media(max-width:640px){ .wrap{padding-block:18px 70px;padding-inline:16px} }
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin:0 0 20px}
.vhead h1{font-size:24px;font-weight:700}
.vhead p{margin:4px 0 0;color:var(--ink-2)}
.vhead .grow{flex:1 1 320px;min-width:0}
.sect-t{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:28px 0 10px}
.previewbar{display:flex;gap:10px;align-items:flex-start;background:rgba(162,112,26,.09);border:1px solid rgba(162,112,26,.35);
  border-left:4px solid var(--warn);border-radius:6px;padding:10px 14px;margin:0 0 20px;font-size:13px;color:var(--ink-2)}
.previewbar b{color:var(--warn)}
.publishbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--warn);border-left:4px solid var(--warn);border-radius:6px;padding:12px 16px;margin:0 0 20px;font-size:13px;color:var(--ink-2)}
.publishbar .pb-t{flex:1 1 320px;min-width:0}
.publishbar b{color:var(--warn)}
.delp{margin:0 0 10px;font-size:13px;color:var(--ink-2)}
.viewonly #c-delblk{display:none!important}
.publishbar .why{display:block;margin-top:4px;font-size:12px;color:var(--ink-3)}
.viewonly [data-go="new"],.viewonly .hq nav button[data-hq="new"],.viewonly #panel-body .pblk:has(#c-off),.viewonly #panel-body .pblk:has(#c-on),.viewonly #c-save,.viewonly .quick{display:none!important}
.foot{margin-top:40px;padding-top:12px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink-3)}

/* the navy headline */
.headline{background:var(--navy);color:#fff;border-radius:8px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;margin:0 0 8px}
.headline .hl-date{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sky-soft);margin-bottom:-6px}
.headline .hl-say{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.4;margin:0}
.headline .hl-say em{font-style:normal;color:var(--sky)}
.headline .hl-say em.hl-late{color:#ffcf73}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:rgba(255,255,255,.07);border:1px solid rgba(116,191,235,.28);border-radius:6px;padding:12px 14px;text-align:left;color:#fff;font:inherit;cursor:pointer;min-width:0}
.tile:hover{background:rgba(255,255,255,.13);border-color:rgba(116,191,235,.5)}
.tile:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.tile b{display:block;font-size:28px;font-weight:700;line-height:1.1;color:#fff}
.tile span{display:block;font-size:12px;color:var(--sky-soft);margin-top:3px}
.tile small{display:block;font-size:11.5px;color:rgba(255,255,255,.62);margin-top:2px}
.tile.warn b{color:#ffcf73}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.cards{grid-template-columns:1fr}}
.hqcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:10px;font:inherit;min-width:0;
  box-shadow:0 1px 2px rgba(13,49,76,.06),0 6px 18px rgba(13,49,76,.06)}
.hqcard:hover{border-color:var(--border-strong)}
.hqcard:focus-visible{outline:2px solid var(--navy-mid);outline-offset:2px}
.hqcard h3{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hqcard h3 .arr{color:var(--ink-3);font-weight:500;font-size:18px}
.hqcard p{margin:0;color:var(--ink-2);font-size:13px}
.hqcard .big{font-size:26px;font-weight:700;line-height:1}
.hqcard .big small{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:6px}
.hqcard .next{font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:9px;margin-top:auto}
.hqcard .next b{color:var(--ink);font-weight:600}
.hqcard.newco{border-style:dashed;align-items:center;justify-content:center;text-align:center;min-height:150px;box-shadow:none;background:var(--surface-2)}
.hqcard.newco .plus{font-size:28px;line-height:1;color:var(--ink-3);font-weight:300}

/* rows */
.hqrows{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.hqrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;width:100%;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left;padding:10px 14px;color:var(--ink);cursor:pointer;font:inherit;font-size:13.5px}
.hqrows .hqrow:last-child{border-bottom:0}
.hqrow:hover{background:var(--surface-2)}
.hqrow:focus-visible{outline:2px solid var(--navy-mid);outline-offset:-2px}
.hqrow .t{flex:1 1 280px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.hqrow .t small{display:block;font-weight:400;color:var(--ink-3);font-size:12px;margin-top:1px}
.hqrow .r{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:flex-end}
.hqrow .d{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.hqrow .arr{color:var(--ink-3);font-size:16px;line-height:1}
.empty{padding:22px 16px;color:var(--ink-3);font-size:13px;text-align:center}

/* status chips — squared, never pills */
.ch{display:inline-flex;align-items:center;gap:5px;border-radius:3px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.ch::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.ch-active{background:rgba(15,123,92,.13);color:var(--good)}
.ch-soon{background:rgba(162,112,26,.15);color:var(--warn)}
.ch-scheduled{background:var(--sky-wash);color:var(--link)}
.ch-expired{background:rgba(179,55,44,.13);color:var(--bad)}
.ch-off{background:var(--surface-3);color:var(--ink-2)}

/* filter tabs */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.fbtn{background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;cursor:pointer}
.fbtn:hover{border-color:var(--border-strong);color:var(--ink)}
.fbtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .fbtn[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .fbtn[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)} }
.fbtn .n{font-weight:500;opacity:.75;margin-left:4px}
.ftext{flex:1 1 240px;min-width:0;max-width:420px;margin-left:auto}
.ftext input{width:100%}

/* fields */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 20px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label, .f .lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.f .req{color:var(--bad);margin-left:2px}
.f .v{font-size:13.4px;color:var(--ink);overflow-wrap:anywhere}
.f .hint{font-size:11.8px;color:var(--ink-3)}
.f .err{font-size:12px;color:var(--bad);font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=date],input[type=search],select{
  font:inherit;font-size:13.4px;color:var(--ink);background:var(--surface);border:1px solid var(--border-strong);border-radius:5px;padding:7px 10px;width:100%;min-width:0}
input:hover,select:hover{border-color:var(--navy-mid)}
input:focus,select:focus{outline:2px solid var(--sky);outline-offset:-1px}
input[readonly]{background:var(--surface-2);color:var(--ink-2);border-style:dashed}
.f.edited label{color:var(--warn)}
.f.edited input,.f.edited select{border-color:var(--warn);background:rgba(162,112,26,.07)}
.f.bad input,.f.bad select{border-color:var(--bad)}
.formcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:16px}
.formcard h2{font-size:15px;font-weight:700;margin-bottom:4px}
.formcard .sub{font-size:12.8px;color:var(--ink-2);margin:0 0 14px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.qb{background:var(--surface-3);border:1px solid var(--border);border-radius:4px;color:var(--ink-2);font:inherit;font-size:12px;font-weight:600;padding:4px 10px;cursor:pointer}
.qb:hover{background:var(--sky-wash);color:var(--ink);border-color:var(--border-strong)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:6px;font:inherit;font-size:13px;font-weight:600;padding:8px 16px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--navy-mid)}
.btn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--border-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:rgba(179,55,44,.08)}
.btn.small{font-size:12.3px;padding:6px 12px}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.45;cursor:not-allowed}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger){background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn:not(.ghost):not(.danger){background:var(--sky);color:var(--navy-deep);border-color:var(--sky)} }
.btnrow{display:flex;flex-wrap:wrap;gap:9px;align-items:center}

/* notes */
.note{border-left:3px solid var(--warn);background:rgba(162,112,26,.08);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0;font-size:13px;color:var(--ink-2)}
.note b{color:var(--warn)}
.note.ok{border-left-color:var(--good);background:rgba(15,123,92,.08)}
.note.ok b{color:var(--good)}
.note.info{border-left-color:var(--sky);background:var(--sky-wash)}
.note.info b{color:var(--ink)}

/* bars — a breakdown of one whole */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:10px;align-items:center;font-size:12.8px}
.bar .bl{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{height:10px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--c1);border-radius:2px}
.bar .bv{color:var(--ink-2);white-space:nowrap;text-align:right;min-width:74px}
.bar .bv b{color:var(--ink);font-weight:600}
.hqcard .bars{gap:6px}
.hqcard .bar{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;font-size:12.3px}
.hqcard .bar .bv{min-width:40px}

/* stat tiles (light) */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 20px}
@media(max-width:900px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
.stat{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:13px 15px;min-width:0}
.stat .lab{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.stat .val{display:block;font-size:24px;font-weight:700;margin-top:4px;line-height:1.1}
.stat .sub{display:block;font-size:11.8px;color:var(--ink-3);margin-top:3px}
.stat.warn{border-left:3px solid var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:900px){ .grid2{grid-template-columns:1fr} }
.box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;min-width:0}
.box h3{font-size:14.5px;font-weight:700;margin-bottom:3px}
.box .sub{font-size:12.3px;color:var(--ink-3);margin:0 0 12px}

/* tables */
.tbl{border:1px solid var(--border);border-radius:8px;overflow-x:auto;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.8px}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{background:var(--surface-3);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:700;border-bottom:2px solid var(--navy-mid);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--sky-wash)}
td.nw{white-space:nowrap}

/* period picker */
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--border);color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--sky);color:var(--navy-deep)} }

/* ── the right panel ────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(6,32,47,.44);z-index:120;border:0;padding:0;display:none}
.scrim.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(720px,calc(100vw - 56px));z-index:121;background:var(--ground);border-left:1px solid var(--border-strong);
  box-shadow:-10px 0 34px rgba(6,32,47,.28);display:none;flex-direction:column;transition:width .22s cubic-bezier(.4,0,.2,1);padding-top:env(safe-area-inset-top,0px)}
.panel.on{display:flex}
.panel.wide{width:min(1320px, calc(100vw - var(--rail-w) - 24px))}
body.railmini .panel.wide{width:min(1320px, calc(100vw - var(--rail-mini) - 24px))}
@media (prefers-reduced-motion:reduce){ .panel{transition:none} }
@media(max-width:820px){ .panel, .panel.wide, body.railmini .panel.wide{width:100vw} }
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto}
.panel-h h2{font-size:16px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.panel-back{background:none;border:0;color:var(--link);font:inherit;font-size:12.8px;font-weight:600;padding:0 6px 0 0;cursor:pointer;white-space:nowrap}
.panel-x{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--ink-2);width:30px;height:30px;font-size:17px;line-height:1;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:0}
.panel-x:hover{background:var(--surface-3);color:var(--ink)}
.panel-x.wide-b{margin-left:auto;border-color:transparent;background:none;color:var(--ink-3)}
.panel-x.wide-b:hover{color:var(--ink);background:var(--sky-wash);border-color:var(--sky)}
.panel-x.wide-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.panel-x.wide-b .i-min{display:none}
.panel.wide .panel-x.wide-b .i-max{display:none}
.panel.wide .panel-x.wide-b .i-min{display:block}
@media(max-width:820px){ .panel-x.wide-b{display:none} .panel-x.wide-b + .panel-x{margin-left:auto} }
.panel-b{overflow:auto;padding:18px 20px 40px;flex:1 1 auto}
.pblk{margin-top:22px}
.pblk > h3{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}

/* the code itself */
.codehead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:620px){ .codehead{grid-template-columns:1fr} }
.qrbox{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;width:200px;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.qrbox svg{width:100%;height:auto;display:block}
.qrbox .cid{font-size:12px;font-weight:700;letter-spacing:.14em;color:#0d314c}
.qrbox .sample{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a2701a}
.linkline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.linkline code{font-family:var(--display);font-size:12.8px;background:var(--surface-3);border:1px solid var(--border);border-radius:4px;padding:4px 8px;overflow-wrap:anywhere;color:var(--ink);user-select:all}
.tstate{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--ink-3);border-radius:6px;padding:11px 14px}
.tstate.active{border-left-color:var(--good)} .tstate.soon{border-left-color:var(--warn)} .tstate.scheduled{border-left-color:var(--sky)}
.tstate.expired{border-left-color:var(--bad)} .tstate.off{border-left-color:var(--ink-3)}
.tstate .sd{font-size:13px;color:var(--ink-2);flex:1 1 240px;min-width:0}
.tstate .sd b{color:var(--ink)}
.confirm{margin-top:12px;padding:12px 14px;border:1px solid var(--bad);border-radius:6px;background:rgba(179,55,44,.06)}
.confirm p{margin:0 0 8px;font-size:13px;color:var(--ink)}
.savebar{position:sticky;bottom:-40px;margin:22px -20px -40px;padding:12px 20px 14px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;align-items:center;z-index:2}
.savebar .sp{margin-left:auto;font-size:12.3px;color:var(--ink-3)}
.savebar .sp b{color:var(--warn)}
.endhint b{color:var(--ink);font-weight:600}
.hist{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.hist li{padding:9px 14px;border-bottom:1px solid var(--rule);font-size:12.8px;display:flex;flex-wrap:wrap;gap:4px 12px}
.hist li:last-child{border-bottom:0}
.hist .hw{color:var(--ink-3);white-space:nowrap;min-width:190px}
.hist .hx{flex:1 1 260px;min-width:0;color:var(--ink)}

/* ── the page a scanner sees ────────────────────────────────── */
.scanwrap{min-height:calc(100vh - var(--hq-h));display:flex;align-items:flex-start;justify-content:center;padding-block:48px 40px;padding-inline:16px}
.scancard{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--sky);border-radius:8px;max-width:520px;width:100%;padding:28px 26px;box-shadow:0 8px 28px rgba(6,32,47,.10)}
.scancard h1{font-size:22px;font-weight:700;margin-bottom:8px}
.scancard p{margin:0 0 14px;color:var(--ink-2);font-size:14.5px}
.scancard .contact{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--ink-2)}
.scancard .contact b{color:var(--ink);user-select:all}
.scancard.inactive{border-top-color:var(--warn)}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--sky);animation:sp 0.9s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spin{animation:none} }

/* scanner previews */
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:1180px){ .frames{grid-template-columns:1fr} }
.frame{border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;background:var(--ground);min-width:0}
.frame .fh{background:var(--surface-3);border-bottom:1px solid var(--border);padding:8px 14px;font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.frame .fu{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 14px;font-size:11.5px;color:var(--ink-3);overflow-wrap:anywhere}
.frame .fbar{background:var(--navy);height:44px;display:flex;align-items:center;padding:0 14px}
.frame .fbar .logoplate{padding:6px 10px}
.frame .fbar .logoplate .wordmark{height:17px}
.frame .scanwrap{min-height:0;padding-block:20px 22px;padding-inline:14px}
.frame .scancard{padding:20px 18px;box-shadow:none}
.frame .scancard h1{font-size:18px}
.frame .scancard p{font-size:13.2px}

/* sign-in */
.signwrap{display:flex;justify-content:center;padding-block:56px 40px;padding-inline:16px}
.signcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;max-width:440px;width:100%;padding:26px 26px 22px;box-shadow:0 8px 28px rgba(6,32,47,.10)}
.signcard h1{font-size:21px;font-weight:700;margin-bottom:6px}
.signcard > p{margin:0 0 18px;color:var(--ink-2);font-size:13.8px}
.signcard .fields{grid-template-columns:1fr}
.signcard .btn{width:100%;justify-content:center;margin-top:16px}
.formerr{margin-top:12px;font-size:12.8px;color:var(--bad);font-weight:600}

/* signed-in account button: squared like the rest of the header (matches Team HQ) */
#rs-account{flex:0 0 auto;display:inline-flex;align-items:center}
#rs-account .rs-who,#rs-account .rs-signin{border-radius:4px}

/* How this tool works on resources.mismo.org
   ─────────────────────────────────────────────
   The page lives in the public repo GitMISMO/qr and is served at resources.mismo.org/qr/.

       ({docs:{id:{…}}}), read and saved through MISMO's save relay (project "qr"). Every save

       "qr-routes"): {codes:{id:{d:link, s:start, e:end, x:1 if off}}}, only what a phone
       needs. If that fails a bar says so; each load also checks it and brings it up to date.

       (once CONFIG.scanLogUrl is set) notes the scan to the Power Automate scan log.

function statusOf(c,t){
  t=t||today();
  if(c.off) return 'off';
  if(c.end && c.end<t) return 'expired';
  if(c.start && c.start>t) return 'scheduled';
  if(c.end && daysBetween(t,c.end)<=30) return 'soon';
  return 'active';
}
const isLive=s=>s==='active'||s==='soon';
function chip(s){ return '<span class="ch ch-'+s+'">'+STATUS[s]+'</span>'; }
function safeUrl(u){ try{ const x=new URL(u); return (x.protocol==='https:'||x.protocol==='http:')?x.href:null; }catch(e){ return null; } }
function deviceOf(ua){ ua=ua||''; if(/iPhone|iPad|iPod/i.test(ua)) return 'iPhone'; if(/Android/i.test(ua)) return 'Android'; if(/Windows|Macintosh|Linux|CrOS/i.test(ua)) return 'Computer'; return 'Other'; }
function regionOf(tz){
  tz=tz||''; if(!tz) return 'Unknown';
  if(/New_York|Detroit|Indiana|Kentucky|Toronto|Montreal/.test(tz)) return 'US Eastern';
  if(/Chicago|Winnipeg|Menominee|North_Dakota/.test(tz)) return 'US Central';
  if(/Denver|Phoenix|Boise|Edmonton/.test(tz)) return 'US Mountain';
  if(/Los_Angeles|Vancouver/.test(tz)) return 'US Pacific';
  if(/Anchorage|Honolulu|Juneau/.test(tz)) return 'Alaska or Hawaii';
  return 'Outside the US';
}

const DEMO_KEY='resources:qr:preview-data', PENDING_KEY='resources:qr:unpublished', SCANS_KEY='resources:qr:scan-file';

function seed(){
  let s=20260930; const rnd=()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const T=today(), now=Date.now();
  const D=n=>addDays(T,n);
  const rows=[
    ['WS27RG','Winter Summit 2027 Registration','Summit Planning','Jonna Critchley','Printed Flyer or Handout','Fall Summit 2026 registration desk flyer','https://www.mismo.org/events',-46,106,5,''],
    ['SP27BN','2027 Sponsorship Prospectus','Amy Moses','Jonna Critchley','Banner or Poster','Fall Summit 2026 sponsor hall banner','https://www.mismo.org/sponsorship',-40,15,4,''],
    ['SP27EM','2027 Sponsorship Prospectus','Amy Moses','Jonna Critchley','Email','Sponsor outreach email, September send','https://www.mismo.org/sponsorship',-33,15,2,''],
    ['MBRAPP','Membership Application','Kelly Bradshaw','Jonna Critchley','Presentation Slide','Member benefits slide, MBA Annual Convention','https://www.mismo.org/membership',-20,182,2,''],
    ['CERT1P','Certification Program Overview','Certification Program','Jonna Critchley','Printed Flyer or Handout','Certification one-page handout','https://www.mismo.org/certification',-58,365,1.6,''],
    ['FS26SV','Fall Summit 2026 Session Survey','Summit Planning','Jonna Critchley','Name Badge','Back of every Fall Summit 2026 name badge','https://www.mismo.org/events',-26,-10,6,''],
    ['SS26AG','Spring Summit 2026 Agenda','Summit Planning','Perry Williams','Booth or Signage','Spring Summit 2026 lobby sign','https://www.mismo.org/events',-140,-110,3,''],
    ['BGLOSS','Business Glossary','Perry Williams','Perry Williams','Website','Footer of the standards landing page','https://www.mismo.org/standards',-70,457,1.2,''],
    ['WS27HT','Winter Summit 2027 Hotel Booking','Summit Planning','Jonna Critchley','Email','Winter Summit confirmation email','https://www.mismo.org/events',-3,106,0,''],
    ['CONNCT','MISMO Connect Sign-Up','Communications','Jonna Critchley','Social Media','LinkedIn post, August','https://collaborate.mismo.org',-60,120,1.4,'Replaced by the new website link'],
    ['WGVOL1','Workgroup Volunteer Interest Form','Perry Williams','Perry Williams','Social Media','LinkedIn post, workgroup call for volunteers','https://www.mismo.org/workgroups',-18,25,1.1,''],
    ['STDLP1','Standards Landing Page','Communications','Jonna Critchley','Printed Flyer or Handout','Standards overview brochure','https://www.mismo.org/standards',-9,273,0,'']
  ];
  const codes=[], scans=[];
  rows.forEach((r,i)=>{
    const created=now-(Math.abs(r[7])+1)*DAY-Math.floor(rnd()*6)*3600e3;
    const c={id:r[0],purpose:r[1],forWhom:r[2],by:r[3],byEmail:(r[3]==='Perry Williams'?'pwilliams':'jcritchley')+'@mismo.org',
      placeType:r[4],place:r[5],dest:r[6],start:D(r[7]),end:D(r[8]),notes:'',off:false,offReason:'',created,history:[]};
    if(r[0]==='WS27HT'){ c.start=D(32); }
    c.history.push({at:created,by:c.by,what:'Created the code'});
    if(r[10]){ c.off=true; c.offReason=r[10]; c.history.push({at:now-9*DAY,by:'Jonna Critchley',what:'Turned the code off: '+r[10]}); }
    if(r[0]==='WS27RG'){ c.history.push({at:now-12*DAY,by:'Jonna Critchley',what:'Changed End Date from '+fmtD(D(60))+' to '+fmtD(D(106))}); }
    codes.push(c);
    const w=r[9]; if(!w) return;
    const from=Math.max(r[7],-75), liveTo=Math.min(r[8],0), offAt=c.off?-9:99;
    for(let d=from; d<=0; d++){
      const inactive = d>r[8] || d>offAt;
      let lam = inactive ? w*0.12 : w*(0.55+rnd()*0.9);
      if(!inactive && r[0]==='FS26SV' && d>=-16 && d<=-13) lam*=9;
      let n=0; for(let k=0;k<Math.round(lam*2);k++) if(rnd()<0.5) n++;
      for(let k=0;k<n;k++){
        const day0=new Date(now+d*DAY); day0.setHours(7,0,0,0); const at=day0.getTime()+Math.floor(rnd()*14*3600e3); if(at>now) continue;
        const u=rnd(), dev=u<.58?'iPhone':u<.92?'Android':u<.985?'Computer':'Other';
        const v=rnd(), reg=v<.37?'US Eastern':v<.63?'US Central':v<.75?'US Mountain':v<.9?'US Pacific':v<.92?'Alaska or Hawaii':v<.97?'Outside the US':'Unknown';
        scans.push({code:c.id,at,device:dev,region:reg,outcome:inactive?'inactive':'sent'});
      }
    }
  });
  scans.sort((a,b)=>b.at-a.at);
  return {codes,scans};
}

const Preview={
  data:null,
  load(){ const raw=store.get(DEMO_KEY); if(raw){ try{ this.data=JSON.parse(raw); if(this.data&&this.data.codes) return; }catch(e){} } this.data=seed(); this.save(); },
  save(){ store.set(DEMO_KEY, JSON.stringify(this.data)); },
  async listCodes(){ return this.data.codes; },
  async listScans(){ return this.data.scans; },
  async createCode(c){ this.data.codes.unshift(c); this.save(); return c; },
  async deleteCode(id){ this.data.codes=this.data.codes.filter(x=>x.id!==id); this.save(); },
  async updateCode(id,patch,entries){ const c=this.data.codes.find(x=>x.id===id); if(!c) throw new Error('That code no longer exists.');
    Object.assign(c,patch); (entries||[]).forEach(e=>c.history.push(e)); this.save(); return c; },
  async resolve(id){
    const c=this.data.codes.find(x=>x.id===id);
    const s=c?statusOf(c):'missing';
    const outcome=isLive(s)?'sent':s==='scheduled'?'early':'inactive';
    if(c){ this.data.scans.unshift({code:c.id,at:Date.now(),device:deviceOf(navigator.userAgent),
      region:regionOf((Intl.DateTimeFormat().resolvedOptions()||{}).timeZone),outcome}); this.save(); }
    return {state:c?s:'missing', dest:c&&isLive(s)?c.dest:null, start:c?c.start:null};
  },
  reset(){ store.del(DEMO_KEY); this.load(); }
};

/* ── the live site: records in qr-data through the relay, the public scan list in qr ── */
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function relayError(code,message,status){ const e=new Error(message); e.code=code; e.status=status||0; return e; }
function relayMessage(j,status,method){
  const c=j&&j.error;
  if(c==='CONFLICT') return 'Someone else saved at the same moment.';
  if(c==='VIEW_ONLY') return 'Your account can view the QR codes but can’t change them.';
  if(c==='NO_ACCESS') return method==='GET'?'Your account doesn’t have access to the QR codes.':'Your account can view the QR codes but can’t change them.';
  if(c==='UNKNOWN_PROJECT') return 'MISMO’s save service doesn’t know this tool yet.';
  if(c==='PATH_NOT_WRITABLE') return 'MISMO’s save service won’t let this tool write that file.';
  if(c==='TOKEN'||c==='GITHUB') return 'MISMO’s save service couldn’t reach GitHub'+(j.message?' ('+j.message+')':'')+'. If this tool is new, its repositories may still need to be added to the relay’s GitHub token.';
  if(c==='CORRUPT') return 'The saved codes file isn’t readable.';
  if(c==='TOO_LARGE') return 'That’s too much to save in one go.';
  return (j&&j.message)||('The save service answered '+status+'.');
}
/* One door to the relay. A signed-out save opens "Sign in to finish saving" and then goes
   through; nothing is ever dropped quietly. */
async function relayCall(method,path,body,again){
  const RS=window.ResourcesSession;
  if(!RS) throw relayError('NO_SIGNIN','The sign-in didn’t load. Reload the page.');
  if(!RS.token()){
    try{ await RS.signIn({reason:'expired'}); }catch(e){}
    if(!RS.token()) throw relayError('SIGNED_OUT', method==='GET'?'You’re signed out. Sign in to see the codes.':'You’re signed out, so this change was not saved.');
  }
  let r;
  try{
    r=await fetch(CONFIG.relayUrl+'/'+path,{method,cache:'no-store',
      headers:Object.assign({Authorization:'Bearer '+RS.token()},body?{'Content-Type':'application/json'}:{}),
      body:body?JSON.stringify(body):undefined});
  }catch(e){ throw relayError('OFFLINE','Couldn’t reach MISMO’s save service. Check your connection and try again.'); }
  const j=await r.json().catch(()=>({}));
  if(r.ok) return j;
  if(r.status===401 && !again){
    try{ await RS.signIn({reason:'expired'}); }catch(e){}
    if(RS.token()) return relayCall(method,path,body,true);
    throw relayError('SIGNED_OUT', method==='GET'?'You’re signed out. Sign in to see the codes.':'You’re signed out, so this change was not saved.');
  }
  if(r.status===403 && j.error==='NO_ACCESS' && method==='GET'){
    try{ RS.signIn({reason:'no-access',toolName:CONFIG.toolName,gated:true}); }catch(e){}
  }
  throw relayError(j.error||('HTTP_'+r.status), relayMessage(j,r.status,method), r.status);
}
const sortKeys=o=>{ if(!o||typeof o!=='object'||Array.isArray(o)) return o; const out={}; Object.keys(o).sort().forEach(k=>out[k]=sortKeys(o[k])); return out; };

const Site={
  codes:{}, sha:null, scans:[], moved:0,
  routes:{ok:true,msg:'',busy:false},
  async readCodes(){
    const b=await relayCall('GET',CONFIG.codesProject+'/data/codes');
    const d=b&&b.data; this.sha=(b&&b.sha)||null;
    return (d&&d.docs&&typeof d.docs==='object')?d.docs:{};
  },
  /* Save a change: apply it to the latest records, send it with the sha, and if someone
     saved first, read theirs and apply it again on top. Then refresh the public scan list. */
  async change(apply){
    let last=null;
    for(let t=0;t<6;t++){
      const next=clone(this.codes); apply(next);
      try{
        const b=await relayCall('PUT',CONFIG.codesProject+'/data/codes',{content:{docs:next},sha:this.sha});
        this.sha=(b&&b.sha)||this.sha; this.codes=next; last=null; break;
      }catch(e){
        last=e;
        if(e.status!==409) throw e;
        await sleep(300*(t+1)+Math.random()*400);
        this.codes=await this.readCodes();
      }
    }
    if(last) throw relayError('CONFLICT','Others kept saving at the same moment, so this change was not saved. Try again.',409);
    await this.publishRoutes();
  },
  routesFrom(docs){
    const out={};
    Object.keys(docs).sort().forEach(id=>{ const c=docs[id]; if(!c||!c.dest) return;
      const r={d:c.dest}; if(c.start) r.s=c.start; if(c.end) r.e=c.end; if(c.off) r.x=1; out[id]=r; });
    return {codes:out};
  },
  /* The public file phones read. Written whole from the records, as one commit. */
  routesText:null,
  async publishRoutes(force){
    const text=JSON.stringify(this.routesFrom(this.codes),null,1)+'\n';
    /* nothing phones read has changed (a note, the purpose): no commit */
    if(!force && text===this.routesText && this.routes.ok) return true;
    this.routes.busy=true;
    try{
      for(let t=0;t<4;t++){
        try{
          await relayCall('POST',CONFIG.routesProject+'/commit',{files:[{path:'data/routes.json',content:text}],message:'Update the QR scan list'});
          this.routesText=text; this.routes={ok:true,msg:'',busy:false}; return true;
        }catch(e){ if(e.status!==409 || t===3) throw e; await sleep(400*(t+1)); }
      }
    }catch(e){ this.routes={ok:false,msg:e.message||'',busy:false}; return false; }
    return false;
  },
  /* On load: is the public scan list the same as the records? If not, fix it (editors) or
     say so (view-only). */
  async checkRoutes(){
    let have=null, fromRepo=false;
    /* the copy in the repository itself: the website's copy lags a save by a minute or more */
    try{ const b=await relayCall('GET',CONFIG.routesProject+'/data/routes'); have=(b&&b.data&&b.data.codes)||{}; fromRepo=true; }catch(e){}
    if(!fromRepo) try{
      const u=new URL('data/routes.json',scanBase()); u.searchParams.set('t',Date.now());
      const r=await fetch(u.href,{cache:'no-store'});
      if(r.ok){ const j=await r.json(); have=j&&j.codes||{}; }
    }catch(e){}
    const want=this.routesFrom(this.codes).codes;
    if(have && JSON.stringify(sortKeys(have))===JSON.stringify(sortKeys(want))){
      this.routesText=JSON.stringify(this.routesFrom(this.codes),null,1)+'\n';
      this.routes={ok:true,msg:'',busy:false}; return; }
    if(fromRepo) this.lastRoutesAt=0;
    /* GitHub takes about a minute to put a new file on the website, so a save made in the last
       two minutes is not treated as missing */
    if(this.lastRoutesAt && Date.now()-this.lastRoutesAt<120000) return;
    if(S.canEdit){ const ok=await this.publishRoutes(); if(ok) this.lastRoutesAt=Date.now(); }
    else this.routes={ok:false,msg:'The public scan list is behind the saved codes. Ask someone who can edit to open this page.',busy:false};
  },
  /* First run: codes in the old public codes.json, or held in this browser for upload, move
     into the private records. */
  async moveOldCodes(){
    if(!S.canEdit) return 0;
    let old={};
    try{
      const u=new URL('data/codes.json',scanBase()); u.searchParams.set('t',Date.now());
      const r=await fetch(u.href,{cache:'no-store'});
      if(r.ok){ const j=await r.json(); if(j&&j.codes&&typeof j.codes==='object') old=j.codes; }
    }catch(e){}
    let held={}; try{ held=JSON.parse(store.get(PENDING_KEY)||'{}')||{}; }catch(e){}
    const add={};
    Object.keys(old).forEach(id=>{ if(!this.codes[id]) add[id]=old[id]; });
    Object.keys(held).forEach(id=>{ const h=held[id]; if(h && (!this.codes[id] || (h.history||[]).length>(this.codes[id].history||[]).length)) add[id]=h; });
    const n=Object.keys(add).length;
    if(!n){ store.del(PENDING_KEY); return 0; }
    await this.change(docs=>{ Object.keys(add).forEach(id=>{ docs[id]=clone(add[id]); }); });
    store.del(PENDING_KEY);
    return n;
  },
  /* Scan counts: one file a month, written by the scan-log flow. */
  async readScans(){
    let first=Date.now();
    Object.values(this.codes).forEach(c=>{ if(c&&c.created&&c.created<first) first=c.created; });
    const months=[], d=new Date(); d.setDate(1);
    const stop=new Date(first); stop.setDate(1); stop.setHours(0,0,0,0);
    while(d>=stop && months.length<24){ months.push(d.getFullYear()+'-'+pad(d.getMonth()+1)); d.setMonth(d.getMonth()-1); }
    const got=await Promise.all(months.map(m=>relayCall('GET',CONFIG.codesProject+'/data/scans-'+m).catch(()=>null)));
    const out=[];
    got.forEach(b=>{ const L=b&&b.data&&Array.isArray(b.data.list)?b.data.list:[];
      L.forEach(s=>{ if(!s||!s.code) return; const at=typeof s.at==='number'?s.at:Date.parse(s.at); if(!isFinite(at)) return;
        out.push({code:String(s.code).toUpperCase(),at,device:s.device||'Other',region:s.region||'Unknown',outcome:s.outcome||'sent'}); }); });
    out.sort((a,b)=>b.at-a.at);
    return out;
  },
  async load(){
    this.codes=await this.readCodes();
    try{ this.moved=await this.moveOldCodes(); }catch(e){ this.moved=0; toast('Couldn’t move the older codes across: '+(e.message||'')); }
    try{ this.scans=await this.readScans(); }catch(e){ this.scans=[]; }
    await this.checkRoutes();
  },
  async reload(){ const before=JSON.stringify(this.codes); this.codes=await this.readCodes(); return before!==JSON.stringify(this.codes); },
  pendingCount(){ return 0; },
  async listCodes(){ return Object.values(this.codes).map(c=>Object.assign({history:[]},c)); },
  async listScans(){ return this.scans; },
  async createCode(c){ await this.change(docs=>{ docs[c.id]=clone(c); }); return c; },
  async deleteCode(id){ await this.change(docs=>{ delete docs[id]; }); },
  async updateCode(id,patch,entries){
    if(!this.codes[id]) throw new Error('That code is no longer on record.');
    await this.change(docs=>{ const c=docs[id]; if(!c) throw new Error('That code is no longer on record.');
      Object.assign(c,patch); c.history=(c.history||[]).concat(entries||[]); });
    return this.codes[id];
  }
};
const Data = LIVE ? Site : Preview;

/* ── a scan on the real site ── */
async function liveResolve(id){
  /* the public scan list: only the link, the dates and whether it is off */
  const get=async name=>{ const u=new URL('data/'+name,scanBase()); u.searchParams.set('t',Date.now());
    const r=await fetch(u.href,{cache:'no-store'}); if(r.status===404) return null;
    if(!r.ok) throw new Error('The scan list didn’t load ('+r.status+').'); return r.json(); };
  let c=null;
  const routes=await get('routes.json');
  if(routes){ const x=routes.codes&&routes.codes[id]; if(x) c={dest:x.d,start:x.s||'',end:x.e||'',off:!!x.x}; }
  else { const old=await get('codes.json'); c=old&&old.codes&&old.codes[id]||null; }   /* before the first save */
  if(!c) return {state:'missing'};
  const s=statusOf(c);
  return {state:s,dest:isLive(s)?c.dest:null,start:c.start};
}
function logScan(id,state){
  if(!CONFIG.scanLogUrl) return;
  let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){}
  const body=JSON.stringify({secret:CONFIG.scanLogSecret,code:id,at:new Date().toISOString(),device:deviceOf(navigator.userAgent),
    region:regionOf(tz),outcome:isLive(state)?'sent':state==='scheduled'?'early':'inactive'});
  try{ if(navigator.sendBeacon && navigator.sendBeacon(CONFIG.scanLogUrl,new Blob([body],{type:'text/plain'}))) return; }catch(e){}
  try{ fetch(CONFIG.scanLogUrl,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body}); }catch(e){}
}

function scanCardHtml(kind,opts){
  opts=opts||{};
  const site=CONFIG.fallbackSite, host=site.replace(/^https?:\/\/(www\.)?/,'');
  const contact='<div class="contact">Questions? Email <b>'+esc(CONFIG.helpEmail)+'</b></div>';
  if(kind==='opening') return '<div class="scancard"><div class="spin" aria-hidden="true"></div><h1>Opening Your Link</h1>'+
    '<p>You’re being taken to the page this MISMO code points to.</p>'+
    (opts.dest?'<p><a class="btn" href="'+esc(opts.dest)+'">Continue</a></p>':'')+'</div>';
  if(kind==='error') return '<div class="scancard inactive"><h1>This Link Didn’t Open</h1>'+
    '<p>Something went wrong on our side. Try scanning the code again in a moment.</p>'+
    '<p><a class="btn" href="'+esc(site)+'">Visit '+esc(host)+'</a></p>'+contact+'</div>';
  if(kind==='early') return '<div class="scancard inactive"><h1>This QR Code Isn’t Active Yet</h1>'+
    '<p>It starts working on <b>'+esc(fmtD(opts.start))+'</b>. In the meantime you can find everything on '+esc(host)+'.</p>'+
    '<p><a class="btn" href="'+esc(site)+'">Visit '+esc(host)+'</a></p>'+contact+'</div>';
  return '<div class="scancard inactive"><h1>This QR Code Is No Longer Active</h1>'+
    '<p>The link behind this code has ended or been turned off by MISMO. You can find current information on '+esc(host)+'.</p>'+
    '<p><a class="btn" href="'+esc(site)+'">Visit '+esc(host)+'</a></p>'+contact+'</div>';
}
async function runScan(raw){
  document.title='MISMO';
  $('#eyebrow').hidden=true; $('#hqname').textContent=''; $('.mastrule').hidden=true;
  const acct=$('#rs-account'); if(acct) acct.hidden=true;
  const box=$('#scan-screen'); box.hidden=false;
  box.innerHTML='<div class="scanwrap">'+scanCardHtml('opening')+'</div>';
  const id=String(raw).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
  let r;
  try{ r = LIVE ? await liveResolve(id) : await Preview.resolve(id); }
  catch(e){ box.innerHTML='<div class="scanwrap">'+scanCardHtml('error')+'</div>'; return; }
  if(LIVE && r.state!=='missing') logScan(id,r.state);
  const dest=r.dest&&safeUrl(r.dest);
  if(dest){ box.innerHTML='<div class="scanwrap">'+scanCardHtml('opening',{dest})+'</div>'; location.replace(dest); return; }
  box.innerHTML='<div class="scanwrap">'+scanCardHtml(r.state==='scheduled'?'early':'inactive',{start:r.start})+'</div>';
}

   QR drawing and downloads
   ════════════════════════════════════════════════════════════════ */
function qrMatrix(text){ const q=qrcode(0,'M'); q.addData(text); q.make(); const n=q.getModuleCount(); return {n,dark:(r,c)=>q.isDark(r,c)}; }
function qrSvg(text,opts){
  opts=opts||{}; const m=qrMatrix(text), qz=4, size=m.n+qz*2; let p='';
  for(let r=0;r<m.n;r++) for(let c=0;c<m.n;c++) if(m.dark(r,c)) p+='M'+(c+qz)+' '+(r+qz)+'h1v1h-1z';
  const cap=opts.caption?1:0, h=size+(cap?5:0);
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+h+'" shape-rendering="crispEdges" role="img" aria-label="QR code">'+
    '<rect width="'+size+'" height="'+h+'" fill="#ffffff"/><path fill="#0d314c" d="'+p+'"/>'+
    (cap?'<text x="'+(size/2)+'" y="'+(size+2.6)+'" text-anchor="middle" font-family="Arial,sans-serif" font-size="2.4" font-weight="700" fill="#a2701a">'+esc(opts.caption)+'</text>':'')+'</svg>';
}
function qrPngBlob(text,caption){
  const m=qrMatrix(text), qz=4, size=m.n+qz*2, scale=Math.max(8,Math.floor(1200/size)), W=size*scale, capH=caption?Math.round(W*.09):0;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=W+capH; const g=cv.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,cv.width,cv.height); g.fillStyle='#0d314c';
  for(let r=0;r<m.n;r++) for(let c=0;c<m.n;c++) if(m.dark(r,c)) g.fillRect((c+qz)*scale,(r+qz)*scale,scale,scale);
  if(caption){ g.fillStyle='#a2701a'; g.font='700 '+Math.round(capH*.42)+'px Arial,sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(caption,W/2,W+capH*.35); }
  return new Promise(res=>cv.toBlob(res,'image/png'));
}
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50);
let dl=null; const dlReady=(window.claude&&window.claude.use)?window.claude.use('downloads').then(x=>{dl=x;}).catch(()=>{}):Promise.resolve();
async function saveFile(filename,blob){
  await dlReady;
  if(dl){ try{ await dl.save({filename,data:blob}); return true; }catch(e){ if(e&&e.code==='declined') return false; toast('That download didn’t go through. Try again in a moment.'); return false; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return true;
}
async function download(c,kind){
  const text=scanUrl(c.id), cap=PREVIEW?'SAMPLE · NOT A LIVE CODE':'';
  const base='MISMO-QR-'+c.id+'-'+slug(c.purpose);
  if(kind==='png') await saveFile(base+'.png', await qrPngBlob(text,cap));
  else await saveFile(base+'.svg', new Blob([qrSvg(text,{caption:cap})],{type:'image/svg+xml'}));
}
function toast(msg){ let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast';
  t.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:var(--navy);color:#fff;border-radius:6px;padding:10px 16px;font-size:13px;box-shadow:0 6px 20px rgba(6,32,47,.32);max-width:calc(100vw - 32px)';
  document.body.appendChild(t);} t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>{t.hidden=true;},2600); }
async function copyText(text,btn){
  try{ await navigator.clipboard.writeText(text); toast('Link copied.'); }
  catch(e){ const code=btn&&btn.parentNode.querySelector('code'); if(code){ const r=document.createRange(); r.selectNodeContents(code); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Press Ctrl+C or ⌘C to copy the selected link.'); }
}

const S={ user:null, canEdit:true, codes:[], scans:[], view:'overview', filter:'all', text:'', period:30, draft:null, justMade:null };
const codeById=id=>S.codes.find(c=>c.id===id);
const scansFor=id=>S.scans.filter(s=>s.code===id);
function since(days){ return days?Date.now()-days*DAY:0; }

function tally(list,key,order){
  const m=new Map(); list.forEach(x=>{ const k=typeof key==='function'?key(x):x[key]; m.set(k,(m.get(k)||0)+1); });
  let arr=Array.from(m,([k,v])=>({k,v}));
  if(order) arr.sort((a,b)=>order.indexOf(a.k)-order.indexOf(b.k)); else arr.sort((a,b)=>b.v-a.v);
  return arr;
}
function topWithOther(arr,n){ if(arr.length<=n) return arr; const head=arr.slice(0,n-1), rest=arr.slice(n-1).reduce((s,x)=>s+x.v,0); return head.concat([{k:'Other',v:rest}]); }
function barsHtml(arr,total,compact){
  if(!total) return '<div class="empty">No scans in this period.</div>';
  const max=Math.max.apply(null,arr.map(x=>x.v));
  return '<div class="bars">'+arr.map(x=>'<div class="bar"><span class="bl" title="'+esc(x.k)+'">'+esc(x.k)+'</span><span class="bt"><i style="width:'+Math.max(2,x.v*100/max)+'%"></i></span>'+
    '<span class="bv"><b>'+num(x.v)+'</b>'+(compact?'':' · '+pct(x.v,total)+'%')+'</span></div>').join('')+'</div>';
}
function codeRow(c,extra){
  const s=statusOf(c), n=scansFor(c.id).length;
  const when = s==='scheduled'?'Starts '+fmtD(c.start): s==='expired'?'Ended '+fmtD(c.end): s==='off'?'Turned off':(c.end?'Ends '+fmtD(c.end):'No end date');
  return '<button type="button" class="hqrow" data-open="'+esc(c.id)+'"><span class="t">'+esc(c.purpose)+

    '<span class="d">'+(extra!=null?extra:plural(n,'scan'))+'</span><span class="d">'+esc(when)+'</span><span class="arr">›</span></span></button>';
}
function rowsHtml(list,extraFn){ return list.length?'<div class="hqrows">'+list.map(c=>codeRow(c,extraFn?extraFn(c):null)).join('')+'</div>':'<div class="hqrows"><div class="empty">No codes here.</div></div>'; }

function validate(d,scope){
  const errs={};
  if(!d.purpose) errs.purpose='Say what this code is for.';
  if(!d.forWhom) errs.forWhom='Say who it’s for.';
  if(!d.placeType) errs.placeType='Choose where it’s going.';
  if(!d.place) errs.place='Describe the placement.';
  if(!d.dest) errs.dest='Add the link people should land on.';
  else { let u=d.dest; if(!/^https?:\/\//i.test(u)) u='https://'+u; const ok=safeUrl(u); if(!ok||!/\./.test(new URL(ok).hostname)) errs.dest='That doesn’t look like a web address.'; else d.dest=ok; }
  if(!d.start) errs.start='Pick a start date.';
  if(d.end && d.start && d.end<d.start) errs.end='The end date is before the start date.';
  $$('[data-f]',scope).forEach(f=>{ const k=f.getAttribute('data-f'), e=f.querySelector('.err'); f.classList.toggle('bad',!!errs[k]); if(e){ e.hidden=!errs[k]; e.textContent=errs[k]||''; } });
  return errs;
}
function newId(){ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let id; do{ id=''; const b=new Uint8Array(6); crypto.getRandomValues(b); b.forEach(x=>id+=A[x%A.length]); }while(codeById(id)); return id; }

const LABEL={purpose:'Purpose',forWhom:'Generated For',placeType:'Placement Type',place:'Placement Details',dest:'Destination Link',start:'Start Date',end:'End Date',notes:'Notes'};
function wireCode(id){
  const c=codeById(id); if(!c) return;
  const body=$('#panel-body');
  const changed=()=>{ let n=0; $$('[data-k]',body).forEach(el=>{ const k=el.getAttribute('data-k'), diff=el.value.trim()!==String(c[k]||''); el.closest('.f').classList.toggle('edited',diff); if(diff) n++; });
    $('#c-save').hidden=!n; $('#c-n').textContent=n; };
  body.addEventListener('input',e=>{ if(e.target.matches('[data-k]')){ if(e.target.id==='e-end') endHint(e.target); changed(); } });
  body.addEventListener('change',e=>{ if(e.target.matches('[data-k]')) changed(); });
  $$('[data-ext]',body).forEach(b=>b.addEventListener('click',()=>{ const el=$('#e-end'), x=b.getAttribute('data-ext'), base=(el.value&&el.value>today())?el.value:today(); el.value=x==='none'?'':addDays(base,+x); endHint(el); changed(); }));
  $$('[data-dl]',body).forEach(b=>b.addEventListener('click',()=>download(c,b.getAttribute('data-dl'))));
  $('#c-copy').addEventListener('click',e=>copyText(scanUrl(id),e.currentTarget));
  $('#c-copyplace').addEventListener('click',()=>{ S.draft=Object.assign(blankDraft(),{purpose:c.purpose,forWhom:c.forWhom,dest:c.dest,end:!c.end?'':(c.end>today()?c.end:addMonths(today(),3)),from:c.id+' · '+c.place}); closePanel(); go('new'); setTimeout(()=>{ const p=$('#n-placeType'); if(p) p.focus(); },30); });
  $('#c-undo').addEventListener('click',()=>renderPanel());
  const off=$('#c-off'); if(off) off.addEventListener('click',()=>{ $('#c-offbox').hidden=false; $('#c-reason').focus(); });
  const offno=$('#c-offno'); if(offno) offno.addEventListener('click',()=>{ $('#c-offbox').hidden=true; });
  $('#c-del').addEventListener('click',()=>{ const b=$('#c-delbox'); b.hidden=false; try{ b.scrollIntoView({block:'nearest'}); }catch(e){} });
  $('#c-delno').addEventListener('click',()=>{ $('#c-delbox').hidden=true; });
  $('#c-delgo').addEventListener('click',async()=>{ const g=$('#c-delgo'); g.disabled=true; g.textContent='Deleting…';
    try{ await Data.deleteCode(id); }catch(e){ g.disabled=false; g.textContent='Delete It'; toast(e.message||'Not deleted. Try again.'); return; }
    closePanel(); await refresh(); render();
    toast(LIVE?(Site.routes.ok?'Deleted '+id+'. Scans show the no-longer-active page within about a minute.':'Deleted '+id+', but the scan list didn’t update. Use Try Again at the top.'):'Deleted '+id+'.'); });
  const offgo=$('#c-offgo'); if(offgo) offgo.addEventListener('click',async()=>{ const why=$('#c-reason').value.trim();
    offgo.disabled=true;
    try{ await Data.updateCode(id,{off:true,offReason:why},[{at:Date.now(),by:S.user.name,what:'Turned the code off'+(why?': '+why:'')}]); }catch(e){ offgo.disabled=false; toast(e.message||'Not turned off. Try again.'); return; }
    S.justMade=null; await refresh(); renderPanel(); toast(LIVE?(Site.routes.ok?'Turned off. Scans show the no-longer-active page within about a minute.':'Turned off and saved, but the scan list didn’t update. Use Try Again at the top.'):'Turned off. Scans now show the no-longer-active page.'); });
  const on=$('#c-on'); if(on) on.addEventListener('click',async()=>{ on.disabled=true;
    try{ await Data.updateCode(id,{off:false,offReason:''},[{at:Date.now(),by:S.user.name,what:'Turned the code back on'}]); }catch(e){ on.disabled=false; toast(e.message||'Not turned back on. Try again.'); return; }
    S.justMade=null; await refresh(); renderPanel();
    const s=statusOf(codeById(id)); toast(s==='expired'?'Turned on, but its end date has passed. Extend the end date to make it work again.':'Turned back on.'); });
  $('#c-savego').addEventListener('click',async()=>{
    const d={}; $$('[data-k]',body).forEach(el=>{ d[el.getAttribute('data-k')]=el.value.trim(); });
    const probe=Object.assign({},c,d), errs=validate(probe,body);
    if(Object.keys(errs).length) return;
    const patch={}, entries=[], now=Date.now();
    Object.keys(d).forEach(k=>{ const nv=k==='dest'?probe.dest:d[k]; if(nv!==String(c[k]||'')){ patch[k]=nv;
      const show=v=>k==='end'&&!v?'no end date':k==='start'||k==='end'?fmtD(v):(v||'blank');
      entries.push({at:now,by:S.user.name,what:'Changed '+LABEL[k]+' from '+show(c[k])+' to '+show(nv)}); } });
    if(!entries.length){ $('#c-save').hidden=true; return; }
    const sg=$('#c-savego'); sg.disabled=true;
    try{ await Data.updateCode(id,patch,entries); }catch(e){ sg.disabled=false; toast(e.message||'Not saved. Try again.'); return; }
    S.justMade=null; await refresh(); renderPanel(); toast(LIVE?(Site.routes.ok?'Saved. Scans follow the change within about a minute.':'Saved, but the scan list didn’t update. Use Try Again at the top.'):'Saved.');
  });
}

/* ── routing and rendering ── */
function go(view,filter){ S.view=view; if(filter) S.filter=filter; $$('.hq nav button[data-hq]').forEach(b=>{ if(b.getAttribute('data-hq')===view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  try{ history.replaceState(null,'','#'+view); }catch(e){}
  render(); window.scrollTo(0,0); }
function render(){
  const v=$('#view');
  if(S.view==='new' && $('#newform')) S.draft=readDraft();
  const fn={overview:vOverview,codes:vCodes,new:vNew,scans:vScans,scanner:vScanner}[S.view]||vOverview;
  v.innerHTML=fn();
  if(S.view==='codes'){ const inp=$('#code-filter'); if(inp){ inp.addEventListener('input',()=>{ S.text=inp.value; const pos=inp.selectionStart; render(); const n=$('#code-filter'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }); } }
  if(S.view==='scans'){ const fi=$('#scanfile'); if(fi) fi.addEventListener('change',()=>{ if(fi.files&&fi.files[0]) loadScanFile(fi.files[0]); }); }
  if(S.view==='new'){ const f=$('#newform');
    f.addEventListener('submit',e=>{ e.preventDefault(); createFromForm(); });
    $$('[data-len]',f).forEach(b=>b.addEventListener('click',()=>{ const st=$('#n-start').value||today(), L=b.getAttribute('data-len');
      const el=$('#n-end'); el.value=L==='none'?'':L.endsWith('d')?addDays(st,parseInt(L,10)):addMonths(st,parseInt(L,10)); endHint(el); }));
    $('#n-end').addEventListener('input',e=>endHint(e.target));
    $('#n-clear').addEventListener('click',()=>{ S.draft=blankDraft(); render(); }); }
}
$('#view').addEventListener('click',e=>{
  const pb=e.target.closest('[data-publish]'); if(pb){ publish(pb.getAttribute('data-publish')); return; }
  const sf=e.target.closest('[data-scanfile]'); if(sf){ $('#scanfile').click(); return; }
  const g=e.target.closest('[data-go]'); if(g){ go(g.getAttribute('data-go'),g.getAttribute('data-filter')); return; }
  const f=e.target.closest('[data-filter]'); if(f){ S.filter=f.getAttribute('data-filter'); render(); return; }

$$('.hq nav button[data-hq]').forEach(b=>b.addEventListener('click',()=>go(b.getAttribute('data-hq'))));
async function publish(kind){
  if(kind!=='routes') return;
  render();
  const ok=await Site.publishRoutes(true); if(ok) Site.lastRoutesAt=Date.now();
  render(); toast(ok?'The scan list is up to date. Phones follow it within about a minute.':'Still didn’t update: '+(Site.routes.msg||'try again in a moment')+'.');
}
/* Scan counts come from the "QR Scans" workbook the Power Automate scan log fills.
   Download it as a CSV and load it here; it stays in this browser until replaced. */
function parseCsv(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; continue; }
    if(ch==='"') q=true; else if(ch===','){ row.push(f); f=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; } else f+=ch; }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
async function loadScanFile(file){
  const rows=parseCsv(await file.text()); if(!rows.length){ toast('That file is empty.'); return; }
  const head=rows[0].map(h=>h.trim().toLowerCase()), col=n=>head.indexOf(n);
  const ci=col('code'), ai=col('at'), di=col('device'), ri=col('region'), oi=col('outcome');
  if(ci<0||ai<0){ toast('That file needs Code and At columns. Download the QR Scans table as a CSV.'); return; }
  const out=[];
  rows.slice(1).forEach(r=>{ const at=Date.parse(r[ai]); const code=String(r[ci]||'').trim().toUpperCase(); if(!code||!isFinite(at)) return;
    out.push({code,at,device:(di>=0&&r[di])||'Other',region:(ri>=0&&r[ri])||'Unknown',outcome:(oi>=0&&r[oi])||'sent'}); });
  out.sort((a,b)=>b.at-a.at);
  store.set(SCANS_KEY,JSON.stringify(out)); await refresh(); render(); toast('Loaded '+plural(out.length,'scan')+'.');
}
async function refresh(){ S.codes=await Data.listCodes(); S.scans=await Data.listScans(); }

/* ── start the tool ── */
async function startApp(u){
  S.user=u;
  document.body.classList.remove('bare'); $('#rail').hidden=false; $('#rail-scrim').hidden=false; $('#app').hidden=false;
  document.body.classList.toggle('viewonly',!S.canEdit);
  $('#view').innerHTML='<div class="note info"><b>Loading the codes…</b></div>';
  try{ if(LIVE) await Site.load(); await refresh(); }catch(e){ $('#view').innerHTML='<div class="note"><b>The codes didn’t load.</b> '+esc(e.message||'')+' Reload the page to try again.</div>'; return; }
  const h=(location.hash||'').replace('#',''); go(['overview','codes','new','scans','scanner'].includes(h)&&(h!=='new'||S.canEdit)?h:'overview');
  if(LIVE && Site.moved) toast('Moved '+plural(Site.moved,'code')+' into MISMO’s private storage.');
  /* pick up colleagues' changes; never while something is being typed or edited */
  if(LIVE) setInterval(async()=>{
    if(document.hidden) return;
    const busy=(S.view==='new') || ($('#c-save')&&!$('#c-save').hidden) || document.activeElement&&document.activeElement.matches&&document.activeElement.matches('input,select,textarea');
    if(busy) return;
    try{ if(await Site.reload()){ await refresh(); render(); if($('#panel').classList.contains('on')) renderPanel(); } await Site.checkRoutes(); }catch(e){}
  },60000);
}

/* ── rail: collapse, remember, search (the shared MISMO pattern) ── */
(function(){
  const KEY='hq.rail.off';
  function set(off,remember){ document.body.classList.toggle('railmini',!!off); const h=$('#rail-hide');
    h.setAttribute('aria-expanded',off?'false':'true'); h.setAttribute('aria-label',off?'Open the menu':'Narrow the menu'); h.title=(off?'Open the menu':'Narrow the menu')+' (backslash)';
    if(off) close(); if(remember!==false) store.set(KEY,off?'1':'0'); }
  function toggle(){ set(!document.body.classList.contains('railmini')); }
  $('#rail-hide').addEventListener('click',toggle);
  $('#rail-scrim').addEventListener('click',()=>set(true));
  $('#rail-qb').addEventListener('click',()=>{ set(false); setTimeout(()=>$('#rail-q').focus(),230); });
  $$('.hq nav button[data-hq]').forEach(b=>b.addEventListener('click',()=>{ if(window.matchMedia('(max-width:900px)').matches) set(true); }));
  document.addEventListener('keydown',e=>{ const t=e.target, typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
    if(!S.user) return;
    if(e.key==='\\'&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); set(false); setTimeout(()=>{ const q=$('#rail-q'); q.focus(); q.select(); },230); } });
  let picked=-1, rows=[];
  const norm=x=>String(x||'').replace(/\s+/g,' ').trim().toLowerCase();
  function gather(q){ const t=norm(q); if(t.length<2) return []; const out=[];
    const score=n=>{ n=norm(n); return n===t?3:n.indexOf(t)===0?2:n.indexOf(t)>=0?1:0; };
    try{ S.codes.forEach(c=>{ const hay=[c.id,c.purpose,c.place,c.placeType,c.forWhom,c.by].join(' ');
      if(norm(hay).indexOf(t)<0) return; out.push({group:'Codes',name:c.purpose,where:c.id+' · '+c.place+' · '+STATUS[statusOf(c)],s:Math.max(score(c.purpose),score(c.id),score(c.place)),go:()=>openCode(c.id)}); }); }catch(e){}
    try{ const people=new Set(); S.codes.forEach(c=>{ people.add(c.forWhom); people.add(c.by); });
      people.forEach(p=>{ if(norm(p).indexOf(t)<0) return; const n=S.codes.filter(c=>c.forWhom===p||c.by===p).length;
        out.push({group:'People and Teams',name:p,where:plural(n,'code'),s:score(p),go:()=>{ S.text=p; S.filter='all'; go('codes'); }}); }); }catch(e){}
    const ORDER=['Codes','People and Teams'], best={}; out.forEach(h=>{ best[h.group]=Math.max(best[h.group]||0,h.s); });
    out.sort((a,b)=>(best[b.group]-best[a.group])||(ORDER.indexOf(a.group)-ORDER.indexOf(b.group))||(b.s-a.s)||String(a.name).localeCompare(String(b.name)));
    return out; }
  const HITS=()=>$('#rail-hits');
  function draw(list){ const box=HITS(); box.textContent=''; rows=[]; picked=-1;
    if(!list.length){ const n=document.createElement('div'); n.className='rh-none'; n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return; }
    let g=null; list.slice(0,24).forEach(h=>{ if(h.group!==g){ g=h.group; const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh'; const nm=document.createElement('b'); nm.textContent=h.name; b.appendChild(nm);
      if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); if(window.matchMedia('(max-width:900px)').matches) set(true); }); rows.push(b); box.appendChild(b); });
    box.hidden=false; }
  function close(){ const b=HITS(); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on',i===picked)); if(rows[picked]) try{ rows[picked].scrollIntoView({block:'nearest'}); }catch(e){} }
  const q=$('#rail-q'), x=$('#rail-qx'); let tmr=null;
  const run=()=>{ x.hidden=!q.value; if(norm(q.value).length<2){ close(); return; } draw(gather(q.value)); };
  q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); });
  q.addEventListener('focus',()=>{ if(norm(q.value).length>=2) run(); });
  q.addEventListener('keydown',e=>{ if(e.key==='Escape'){ close(); q.blur(); return; } if(!rows.length) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); }
    else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); } });
  x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
  document.addEventListener('click',e=>{ if(!e.target.closest('.railfind')) close(); });
  let off=null; const v=store.get(KEY); if(v!==null) off=(v==='1'); if(off===null) off=window.matchMedia('(max-width:900px)').matches; set(off,false);
})();

/* ── theme toggle (shared across MISMO pages) ── */
(function theme(){
  const btn=$('#theme-btn');
  const cur=()=>document.documentElement.getAttribute('data-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const paint=()=>{ const dark=cur()==='dark'; $('#theme-lab').textContent=dark?'Light Mode':'Dark Mode'; btn.title='Switch to '+(dark?'light':'dark')+' mode'; };
  btn.addEventListener('click',()=>{ document.documentElement.setAttribute('data-theme',cur()==='dark'?'light':'dark'); paint(); store.set('mismo.portal.theme',cur()); });
  paint();
})();

/* ── start ── */
(async function boot(){
  let code=null; try{ code=new URLSearchParams(location.search).get('c'); }catch(e){}
  if(!LIVE) Preview.load();
  if(code){ runScan(code); return; }
  if(!LIVE){ startApp({name:'Jonna Critchley',email:'jcritchley@mismo.org'}); return; }
  const RS=window.ResourcesSession;
  if(!RS){ $('#scan-screen').hidden=false; $('#scan-screen').innerHTML='<div class="scanwrap"><div class="scancard inactive"><h1>Sign-In Didn’t Load</h1><p>Reload the page. If it keeps happening, the shared sign-in at resources.mismo.org may be down.</p></div></div>'; return; }
  RS.onChange(s=>{ if(!s) location.reload(); });
  try{ await RS.requireAccess('qr',{toolName:CONFIG.toolName,eyebrow:'Programs & Operations'}); }catch(e){ return; }
  const s=RS.current()||{};
  try{ S.canEdit=!!RS.canEdit('qr'); }catch(e){ S.canEdit=false; }
  startApp({name:s.name||s.email||'MISMO Staff',email:s.email||''});
})();
})();
